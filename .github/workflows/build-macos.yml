name: Build macOS App

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: intel
            runner: macos-13
            app_label: Intel
          - arch: silicon
            runner: macos-14
            app_label: Apple Silicon
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build app (${{ matrix.arch }})
        run: |
          python -m PyInstaller --onefile --windowed \
            --icon="assets/mechsoc_32.ico" \
            --add-data "assets/mechsoc_32.ico:assets" \
            --add-data "assets/mechsoc_128.png:assets" \
            --add-data "assets/mechsoc_256.png:assets" \
            --add-data "version_info.json:." \
            main.py

      - name: Rename .app bundle (${{ matrix.arch }})
        run: |
          mv dist/main.app "dist/MechSoc Email Tool (${{ matrix.app_label }}).app"

      - name: Zip .app bundle (${{ matrix.arch }})
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "MechSoc Email Tool (${{ matrix.app_label }}).app" mechsoc_email_tool_macos_${{ matrix.arch }}.zip


      - name: Upload macOS artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app-${{ matrix.arch }}
          path: dist/mechsoc_email_tool_macos_${{ matrix.arch }}.zip

      - name: Artifact summary
        run: |
          echo "Built macOS ${{ matrix.arch }} artifact: mechsoc_email_tool_macos_${{ matrix.arch }}.zip"