name: Publish Linux

on:
  workflow_dispatch:
  push:
    branches:
      - version2

concurrency:
  group: mechsocemailtool-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Get version from pyproject.toml
        id: version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: |
          source .venv/bin/activate
          python -m PyInstaller mechsocemailtool.spec
          cd dist
          chmod +x mechsocemailtool
          tar -czf mechsocemailtool-linux.tar.gz mechsocemailtool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-linux
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mechsocemailtool-linux.tar.gz
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}