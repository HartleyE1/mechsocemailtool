name: Publish macOS Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - version2

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    env:
      ARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Get version from pyproject.toml
        id: version
        shell: bash
        run: |
          python - <<'PYEOF' >> $GITHUB_OUTPUT
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print('version=' + data['project']['version'])
          PYEOF

      - name: Check if release exists for this version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package app
        if: steps.check.outputs.exists == 'false'
        run: |
          source .venv/bin/activate
          python -m PyInstaller mechsocemailtool.spec
          cd dist
          chmod +x mechsocemailtool
          tar -czf mechsocemailtool-macos-arm64.tar.gz mechsocemailtool

      - name: Upload artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-macos-silicon
          path: dist

      - name: Upload to GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}