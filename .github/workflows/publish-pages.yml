name: Publish Latest Builds to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Windows App", "Build macOS App"]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      MAC_INTEL_ZIP: mechsoc_email_tool_macos_intel.zip
      MAC_SILICON_ZIP: mechsoc_email_tool_macos_silicon.zip

    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          persist-credentials: false


      - name: Download windows artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-windows.yml
          name: windows-app
          path: download/windows

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-macos.yml
          name: macOS-app-intel
          path: download/macos/intel

      - name: Download macOS Silicon artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-macos.yml
          name: macOS-app-silicon
          path: download/macos/silicon

      - name: Generate links.html
        run: |
          mkdir -p download
          rm -f download/links.html
          echo "<h2>Latest Downloads</h2>" > download/links.html
          echo "<ul>" >> download/links.html
          echo "<li><a href='/mechsocemailtool/download/windows/MechSoc Email Tool.exe'>Windows (.exe)</a></li>" >> download/links.html
          echo "<li><a href='/mechsocemailtool/download/macos/intel/${MAC_INTEL_ZIP}'>macOS Intel (.zip)</a></li>" >> download/links.html
          echo "<li><a href='/mechsocemailtool/download/macos/silicon/${MAC_SILICON_ZIP}'>macOS Apple Silicon (.zip)</a></li>" >> download/links.html
          echo "</ul>" >> download/links.html


      - name: Push to pages branch
        run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .
            git commit -m "Update downloads" || echo "No changes to commit"
            git push https://$PAGES_DEPLOY_TOKEN@github.com/HartleyE1/mechsocemailtool.git HEAD:pages
        env:
            PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}