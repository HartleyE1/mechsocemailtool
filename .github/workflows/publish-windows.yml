name: Publish Windows NiceGUI

on:
  workflow_dispatch:
  push:
    branches:
      - version2

permissions:
  contents: write
  pages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m PyInstaller mechsocemailtool.spec

      - name: Package app (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m PyInstaller mechsocemailtool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-${{ matrix.os }}
          path: dist

      - name: Rename binary for release
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            Windows)
              mv mechsocemailtool.exe mechsocemailtool-windows.exe
              ;;
            macOS)
              if [ -d mechsocemailtool.app ]; then
                ditto -c -k --sequesterRsrc --keepParent mechsocemailtool.app mechsocemailtool-macos.app.zip
              elif [ -f mechsocemailtool ]; then
                mv mechsocemailtool mechsocemailtool-macos
              else
                echo "Expected mechsocemailtool.app or mechsocemailtool in dist/, but neither was found. Check PyInstaller build logs for errors."
                exit 1
              fi
              ;;
            Linux)
              mv mechsocemailtool mechsocemailtool-linux
              ;;
          esac

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: dist/*
          tag_name: v2.0.1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
