name: Publish Windows NiceGUI

on:
  workflow_dispatch:
  push:
    branches:
      - version2

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Package NiceGUI app (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          .\.venv\Scripts\nicegui-pack.exe --onefile --windowed --name "mechsocemailtool-${{ matrix.os }}" --icon assets/mechsoc_32.ico --add-data "assets/splash.png;assets" main.py

      - name: Package NiceGUI app (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          nicegui-pack --onefile --windowed --name "mechsocemailtool-${{ matrix.os }}" --icon assets/mechsoc_32.icns --add-data "assets/splash.png:assets" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-${{ matrix.os }}
          path: dist
