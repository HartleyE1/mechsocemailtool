name: Publish Windows NiceGUI

on:
  workflow_dispatch:
  push:
    branches:
      - version2

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install nicegui-pack pyinstaller

      - name: Package NiceGUI app
        run: nicegui-pack --output-dir output --onefile main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicegui-${{ matrix.os }}
          path: output
