name: Publish Windows

on:
  workflow_dispatch:
  push:
    branches:
      - version2

concurrency:
  group: mechsocemailtool-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Get version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content pyproject.toml | Select-String '^\s*version\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          if (-not $version) {
            throw "Could not read project version from pyproject.toml"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package app
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m PyInstaller mechsocemailtool.spec

      - name: Rename binary for release
        shell: bash
        run: |
          cd dist
          if [ -f mechsocemailtool.exe ]; then
            mv mechsocemailtool.exe mechsocemailtool-windows.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-windows
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/mechsocemailtool-windows.exe
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
