name: Publish Windows NiceGUI

on:
  workflow_dispatch:
  push:
    branches:
      - version2

permissions:
  contents: write
  pages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m PyInstaller mechsocemailtool.spec

      - name: Package app (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m PyInstaller mechsocemailtool.spec
          cd dist
          BINARY=mechsocemailtool
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARCH=${{ matrix.arch }}
            TAR_NAME="${BINARY}-macos-${ARCH}.tar.gz"
            if [ -f "$BINARY" ]; then
              chmod +x "$BINARY"
              tar -czf "$TAR_NAME" "$BINARY"
            fi
          else
            TAR_NAME="${BINARY}-linux.tar.gz"
            if [ -f "$BINARY" ]; then
              chmod +x "$BINARY"
              tar -czf "$TAR_NAME" "$BINARY"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-${{ matrix.os }}
          path: dist

      - name: Rename binary for release
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            Windows)
              if [ -f mechsocemailtool.exe ]; then
                mv mechsocemailtool.exe mechsocemailtool-windows.exe
              fi
              ;;
            macOS)
              # macOS builds are packaged into tar.gz named with arch already
              ;;
            Linux)
              # Linux builds are packaged into tar.gz already
              ;;
          esac

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: dist/*
          tag_name: v2.0.1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
