name: Publish Windows NiceGUI

on:
  workflow_dispatch:
  push:
    branches:
      - version2

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Install dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Package app (Windows)
        if: runner.os == 'Windows'
        run: |
          . .\.venv\Scripts\Activate.ps1
          python -m PyInstaller mechsocemailtool.spec

      - name: Package app (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m PyInstaller mechsocemailtool.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechsocemailtool-${{ matrix.os }}
          path: dist

      - name: Deploy to GitHub Pages
        if: success()
        shell: bash
        run: |
          # Determine OS folder name
          case "${{ runner.os }}" in
            Windows) OS_FOLDER="windows" ;;
            macOS) OS_FOLDER="macos" ;;
            Linux) OS_FOLDER="linux" ;;
            *) OS_FOLDER="unknown" ;;
          esac
          
          # Clone pages branch into temp directory
          git clone --branch pages --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} pages_checkout
          
          # Create version/OS directory structure
          mkdir -p "pages_checkout/downloads/version 2.0.1/${OS_FOLDER}"
          
          # Copy artifacts
          cp dist/* "pages_checkout/downloads/version 2.0.1/${OS_FOLDER}/" || true
          
          # Commit and push
          cd pages_checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update $OS_FOLDER artifacts for version 2.0.1 [ci skip]"
            git push origin pages
          else
            echo "No changes to commit for $OS_FOLDER"
          fi
